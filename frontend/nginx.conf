# Batasi percobaan login berulang dari satu alamat IP (anti brute-force)
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=20r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Izinkan unggahan poster (backend membatasi ukuran sebenarnya)
    client_max_body_size 6m;

    # Selalu validasi ulang berkas statis agar perubahan langsung terlihat
    add_header Cache-Control "no-cache";

    # Rute bersih: /login -> login.html, /app -> app.html, /event -> event.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Login dibatasi kecepatannya, sisanya tidak
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy ke service backend (nama service Compose = "backend")
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }
}

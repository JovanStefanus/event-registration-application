server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Selalu validasi ulang berkas statis agar perubahan langsung terlihat
    add_header Cache-Control "no-cache";

    # Rute bersih: /login -> login.html, /register -> register.html, /app -> app.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Reverse proxy ke service backend (nama service Compose = "backend")
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }
}

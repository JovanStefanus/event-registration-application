services:
  db:
    image: postgres:16-alpine
    container_name: event_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data   # data persisten
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Port DB tidak dipublikasikan ke host (hanya bisa diakses antar-container)

  backend:
    build: ./backend
    container_name: event_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di file .env}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-8}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Penyimpanan poster (volume Docker) dan batas unggahan
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Peta: proxy geocode ke Nominatim/OpenStreetMap
      GEOCODE_URL: ${GEOCODE_URL:-https://nominatim.openstreetmap.org}
      GEOCODE_USER_AGENT: ${GEOCODE_USER_AGENT:-KarcisApp/2.0 (demo pendaftaran kegiatan)}
      # Notifikasi email (kosongkan SMTP_HOST untuk mode dev: hanya dicatat ke log)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      REMINDER_HOURS: ${REMINDER_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"      # opsional, untuk akses Swagger /docs
    volumes:
      - uploads:/app/uploads              # poster kegiatan persisten
    networks:
      - backend_net
      - frontend_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: event_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - frontend_net

  # Opsional: jalankan dengan `docker compose --profile observability up -d`
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: event_prometheus
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - backend_net

volumes:
  pgdata:
  uploads:
  promdata:

networks:
  frontend_net:
  backend_net:
